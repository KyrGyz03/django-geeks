<h1>{{ blog_id.title }}</h1>

<img src="{{blog_id.image.url}}" alt="" width="400", height=" 350">
{% if blog_id.description %}
    <p>{{blog_id.description}}</p>
{% else %}
    <p>Описание не добавлено</p>
{% endif %}
<p>{{blog_id.genre}}</p>
{% if blog_id.video_url %}
    <a href="{{blog_id.video_url}}">{{blog_id.video_url}}</a>
{% else %}
    <p>Тут без ролика</p>
{% endif %}
<p>{{blog_id.created}}</p>
